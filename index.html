<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OwlUV - Skener skrivenog teksta i AI zamki</title>
<!-- Naslov i opis mijenjaju se s jezikom sucelja (js/app.js, applyLang).
     Ovdje stoji hrvatska inacica, jer je hrvatski pocetni jezik. -->
<meta name="description" content="OwlUV je skener skrivenog teksta i AI zamki: otkriva tekst skriven bojom ili velicinom fonta, nevidljive Unicode znakove i fraze koje pokusavaju navesti AI na krivi odgovor. Radi potpuno lokalno u pregledniku.">
<!-- Ikone se citaju iz repozitorija: alat mora raditi i bez interneta. -->
<link rel="icon" href="assets/sovaweb_favicon.ico" sizes="16x16 32x32">
<link rel="icon" type="image/png" sizes="512x512" href="assets/sovaweb_favicon_512.png">
<link rel="apple-touch-icon" href="assets/sovaweb_favicon_512.png">
<!-- Dodavanje na pocetni zaslon telefona: radi kao aplikacija, bez trake preglednika. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1B26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OwlUV">
<style>
  :root{
    --paper:#F7F9FB; --panel:#FFFFFF; --ink:#14232E; --muted:#5B6B77;
    --line:#D6DEE6; --dark:#0E1B26;
    --uv:#6D28D9; --uv-bg:#F0E9FC;
    --warn:#B45309; --warn-bg:#FBEEDD;
    --danger:#B3261E; --danger-bg:#FAE4E2;
    --ok:#15803D; --ok-bg:#E1F3E8;
    --none:#334155; --none-bg:#EEF2F6;
    --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  header{background:var(--dark);color:#EAF1F7;padding:20px 24px}
  .wrap{max-width:1100px;margin:0 auto}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8FB0C9}
  header h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:4px;
            display:flex;align-items:center;gap:12px}
  header h2.tagline{font-size:18px;font-weight:600;color:#C6D8E6;margin-top:4px;letter-spacing:-.01em}
  header p{color:#A9BFCF;font-size:13px;margin-top:6px;max-width:640px}

  /* ---- sova uz naziv, sa zrakom koja izlazi iz ociju ----
     Crtez se animira u samoj stranici (CSS), nije gif: rubovi ostaju glatki na
     svakoj velicini, podloga se vidi kroz prozirne dijelove, i nema dodatne
     tezine. Zraka prijede jednom, s lijeva na desno, pa se ugasi. */
  .owlmark{position:relative;display:inline-block;line-height:0;flex:none}
  .owlmark .owl{height:39px;width:auto;display:block}
  .owlmark .beam{position:absolute;left:56%;top:32%;width:57px;height:17px;
       transform-origin:0 50%;transform:scaleX(.06);opacity:0;pointer-events:none;
       border-radius:2px;
       background:linear-gradient(90deg,rgba(124,58,237,.95),rgba(167,139,250,.7) 48%,rgba(167,139,250,0));
       clip-path:polygon(0 42%,100% 0,100% 100%,0 58%)}
  .owlmark.sweep .beam{animation:uvBeam 4s cubic-bezier(.2,.7,.3,1) 1}
  @keyframes uvBeam{
    0%{opacity:0;transform:scaleX(.06)}
    12%{opacity:1}
    62%{opacity:1;transform:scaleX(1)}
    100%{opacity:0;transform:scaleX(1.08)}
  }
  @media(prefers-reduced-motion:reduce){
    .owlmark .beam{display:none}
    .owlmark.sweep .beam{animation:none}
  }
  /* Uski zaslon: naziv i sova se vracaju na manju mjeru, a gumbi u zaglavlju
     panela prelaze u novi red umjesto da guraju stranicu u sirinu. */
  @media(max-width:560px){
    header h1{font-size:27px;gap:9px}
    header h2.tagline{font-size:15px}
    .owlmark .owl{height:31px}
    .owlmark .beam{width:45px;height:14px}
    .panel-h .hbtns{margin-left:0;width:100%}
    .btn.reset{margin-left:0}
    .btn.reset::before{display:none}
    .fhead{flex-wrap:wrap}
    footer .by img{height:54px}
  }
  /* Mobitel: prstom se ne pogada isto sto i misem. Na uskom zaslonu svi gumbi
     dobivaju vecu povrsinu za dodir, rubovi stranice se stanjuju da tekst dobije
     sirinu, a paneli se snize da se do drugog panela ne mora dugo listati.
     Na sirokom zaslonu se nista od ovoga ne mijenja. */
  @media(max-width:560px){
    main{padding:16px 12px 48px}
    .grid{gap:14px}
    .grid>.panel{min-height:360px;max-height:none}
    #input,.viz{padding:14px}
    .btn{padding:12px 18px;font-size:13px}
    .btn.sm{padding:10px 14px;font-size:12px}
    .lang{padding:9px 13px;font-size:12px}
    .langs{max-width:none}
    .hitbtn{padding:8px 14px;font-size:15px}
    .panel-h{padding:12px}
  }
  .langs{display:flex;gap:5px;flex-wrap:wrap;max-width:220px}
  .lang{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:6px 10px;border-radius:6px;border:1px solid #35505F;background:transparent;color:#A9BFCF;cursor:pointer}
  .lang:hover{border-color:#5C7A8C;color:#D5E3EC}
  .lang.active{background:#EAF1F7;color:var(--dark);border-color:#EAF1F7}
  main{padding:22px 24px 60px}
  /* Oba panela su uvijek jednako visoka i rastu zajedno: mreza ih razvlaci, a
     prazan prostor u svakom panelu upija njegovo podrucje prikaza teksta. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .grid>.panel{display:flex;flex-direction:column;min-height:540px;max-height:820px}
  .grid>.panel>*{flex:none}
  .grid>.panel>.dropzone,.grid>.panel>.viz{flex:1 1 auto;min-height:0}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h .t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .panel-h .t.ink{color:var(--ink);font-weight:800}
  .panel-h .t.uv{color:var(--uv);font-weight:800}
  .panel-h .hbtns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}

  /* ime i velicina ucitane datoteke */
  .fileinfo{display:none;font-family:var(--mono);font-size:11px;background:var(--uv-bg);color:var(--uv);
            border:1px solid #D9CBF3;border-radius:20px;padding:3px 10px;max-width:100%;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- lijevo: dokument u izvornom izgledu + zona za ispustanje ---- */
  .dropzone{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #input{flex:1 1 auto;min-height:0;overflow:auto;padding:18px;outline:none;
         font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.65;color:var(--ink);background:#fff}
  #input:empty::before{content:attr(data-ph);color:#9AA8B2;font-family:var(--mono);font-size:13px;line-height:1.7}
  #input:focus{box-shadow:inset 0 0 0 2px #E4EAF0}
  #input p{margin:0 0 12px}
  #input h1{font-size:24px;margin:0 0 8px;line-height:1.25}
  #input h2{font-size:19px;margin:20px 0 8px}
  #input h3{font-size:17px;margin:16px 0 6px}
  #input ul,#input ol{margin:0 0 12px 22px}
  #input table{border-collapse:collapse}
  #input td,#input th{border:1px solid var(--line);padding:4px 8px}
  .drop-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
       background:rgba(240,233,252,.94);border:2px dashed var(--uv);border-radius:8px;
       font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--uv);
       text-transform:uppercase;pointer-events:none;z-index:5;text-align:center;padding:20px}
  .dropzone.dragging .drop-overlay{display:flex}

  /* ---- desno: isti dokument, ali pod UV lampom ---- */
  .viz{flex:1 1 auto;min-height:0;padding:18px;overflow:auto;
       font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.7;color:var(--ink)}
  .viz p{margin:0 0 12px}
  .viz h1{font-size:24px;margin:0 0 8px;line-height:1.25}
  .viz h2{font-size:19px;margin:20px 0 8px}
  .viz h3{font-size:17px;margin:16px 0 6px}
  .viz ul,.viz ol{margin:0 0 12px 22px}
  .viz table{border-collapse:collapse}
  .viz td,.viz th{border:1px solid var(--line);padding:4px 8px}

  /* ---- sadrzaj koji se misem ne moze kopirati (Word) ---- */
  .uv-annex{margin:18px 0 0;border-top:1px dashed var(--line);padding-top:10px}
  .uv-annex-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
              color:var(--muted);margin-bottom:6px}
  .uv-annex-i{font-size:14px;border-left:3px solid var(--line);padding:2px 0 2px 10px;margin-bottom:8px}
  .uv-annex-i p{margin:0 0 4px}
  .uv-tag{font-family:var(--mono);font-size:10px;background:var(--paper);border:1px solid var(--line);
          border-radius:4px;padding:1px 6px;margin-right:6px;color:var(--muted);white-space:nowrap}
  .uv-box{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0}

  /* otkriveno: bilo skriveno bojom, sitnim fontom ili Wordovom oznakom */
  .revealed{background:var(--uv-bg);color:var(--uv)!important;font-size:1em!important;
            font-weight:600;border-bottom:2px dashed var(--uv);border-radius:3px;padding:1px 3px;
            display:inline!important;visibility:visible!important;opacity:1!important;position:static!important;
            box-shadow:0 0 10px rgba(109,40,217,.18)}
  .revealed *{color:inherit!important;font-size:1em!important;display:inline!important;visibility:visible!important;opacity:1!important}
  .bugmark{user-select:none;-webkit-user-select:none;font-size:.85em}
  .bugmark::before{content:"\1F41E";margin:0 3px}

  /* fraza koja govori suprotno */
  mark.phrase{background:var(--danger-bg);color:var(--danger);font-weight:700;border-radius:3px;padding:0 2px}
  .revealed mark.phrase{background:#F6D9D6;color:var(--danger)!important}

  /* nevidljivi znak */
  .chip{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;padding:0 5px;border-radius:4px;
        background:#EDF2F6;color:var(--muted);border:1px solid var(--line);margin:0 1px;vertical-align:middle;
        user-select:none;-webkit-user-select:none}
  .chip::before{content:attr(data-l)}

  textarea{display:none}
  .btn{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:7px;padding:9px 16px;cursor:pointer}
  .btn:hover{background:#243B4D}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:#EDF2F6}
  .btn.sm{padding:6px 11px;font-size:11px}
  /* "Novi tekst" je izlaz iz trenutnog dokumenta, pa mora biti ravnopravan
     ostalim gumbima u zaglavlju, ali i dalje vidljivo odvojen od njih. */
  .btn.reset{border-color:var(--muted);border-width:1.5px;color:var(--ink);background:transparent;
             font-weight:800;padding:7px 14px;font-size:11.5px;margin-left:9px;position:relative}
  .btn.reset::before{content:"";position:absolute;left:-6px;top:15%;height:70%;width:1px;background:var(--line)}
  .btn.reset:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.reset:hover::before{background:var(--line)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}

  /* ---- upozorenje da je tekst izmijenjen rukom ----
     Ne skenira se pri svakom tipkanju, jer je to nepotreban posao koji na
     velikom dokumentu usporava rad. Umjesto toga se jasno kaze da prikazani
     nalazi vise ne vrijede, i ponudi gumb koji ih osvjezi. */
  .stale{display:none;align-items:center;gap:12px;flex-wrap:wrap;
         padding:12px 16px;border-top:2px solid var(--danger);background:var(--danger-bg)}
  .stale.on{display:flex}
  .stale .msg{flex:1 1 220px;min-width:0;font-size:12.5px;font-weight:700;color:var(--danger)}
  .stale .msg::before{content:"\26A0";margin-right:7px;font-weight:400}
  .btn.rescan{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.rescan:hover{background:#8F1E17;border-color:#8F1E17}

  /* ---- oblacic koji ne prekriva sadrzaj ----
     Preglednikov vlastiti oblacic iskoci kod misa i prekrije prvi red teksta u
     panelu ispod. Ovaj se crta ispod gumba i poravnat s njim, pa se zna gdje ce
     se pojaviti. */
  .hastip{position:relative}
  .hastip::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:0;
       width:max-content;max-width:270px;background:var(--dark);color:#EAF1F7;
       font-family:var(--sans);font-size:11.5px;font-weight:400;line-height:1.45;
       letter-spacing:0;text-transform:none;text-align:left;white-space:normal;
       padding:8px 10px;border-radius:7px;box-shadow:0 8px 20px rgba(14,27,38,.28);
       opacity:0;visibility:hidden;transition:opacity .12s ease;z-index:30;pointer-events:none}
  .hastip.tip-right::after{left:auto;right:0}
  .hastip:hover::after,.hastip:focus-visible::after{opacity:1;visibility:visible}
  @media(max-width:560px){.hastip::after{max-width:200px}}

  /* ---- potvrda da je kopirano, sama se povuce ---- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
         background:var(--dark);color:#EAF1F7;font-size:13px;font-weight:600;
         padding:11px 18px;border-radius:24px;box-shadow:0 10px 26px rgba(14,27,38,.3);
         opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease;
         z-index:60;pointer-events:none;max-width:88vw;text-align:center}
  .toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){.toast{transition:none}}

  /* ---- jedini gumb za kopiranje, u desnom panelu ispod prikaza ---- */
  .copybar{padding:12px 16px;border-top:1px solid var(--line);display:flex;
           align-items:center;gap:10px;flex-wrap:wrap}
  .copybar .cnote{font-size:11.5px;color:var(--muted);flex:1 1 100%;min-width:0}
  .copybar .btns{display:flex;gap:8px;flex-wrap:wrap}
  .verdict{border-radius:10px;padding:16px 18px;margin-bottom:18px;display:none;border:1px solid}
  .verdict .big{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .verdict .sub{font-size:13px;margin-top:4px}
  .v-ok{display:block;background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .v-warn{display:block;background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .v-danger{display:block;background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
  .v-none{display:block;background:var(--none-bg);border-color:var(--none);color:var(--none)}
  .v-err{display:block;background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .findings{display:flex;flex-direction:column;gap:12px;padding:16px}
  .finding{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:12px 14px}
  .finding.uv{border-left-color:var(--uv)}
  .finding.warn{border-left-color:var(--warn)}
  .finding.danger{border-left-color:var(--danger)}
  .finding.info{border-left-color:#2563EB}
  .finding h3{font-size:14px;font-weight:700}
  .finding .why{font-size:12.5px;color:var(--muted);margin-top:3px}
  .empty{padding:26px 16px;color:var(--muted);font-size:13px;text-align:center;font-family:var(--sans)}
  .note{font-size:11.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line);font-family:var(--sans)}
  .note.recon{display:none;background:var(--uv-bg);color:#4C1D95;border-top-color:#D9CBF3}
  .count{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--muted)}
  footer{padding:0 24px 40px}
  footer .wrap{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  footer .by{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line);flex-wrap:wrap}
  footer .by img{height:70px;width:auto;display:block;opacity:.95}
  footer .by a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  footer .by a:hover{color:var(--uv)}
  @media(max-width:520px){footer .by{padding-left:0;border-left:0;width:100%}}

  /* ---- tanke, nenametljive oznake: duga crtica i pomijesana pisma ----
     Namjerno tiho: duge crtice su ceste i u sasvim normalnom tekstu, pa oznaka
     ne smije konkurirati ljubicastom (skriveno) ni crvenom (fraza). */
  .dashmark,.mixmark{border-bottom:1px dotted #A9B6C0;padding-bottom:1px}
  .mixmark{background:rgba(169,182,192,.12);border-radius:2px}

  /* ---- isticanje pojave na koju je skocio klik na nalaz ----
     Bljesne jace od ostalih istih oznaka, pa ostane tanko obrubljena dok se ne
     skoci dalje - kao tekuci pogodak pri trazenju rijeci u pregledniku. */
  .uv-jump{animation:uvJump 1.2s ease-out 1}
  @keyframes uvJump{
    0%{background:#FDE68A;box-shadow:0 0 0 5px #FDE68A,0 0 16px 7px rgba(217,119,6,.5)}
    70%{background:#FDE68A;box-shadow:0 0 0 5px #FDE68A,0 0 16px 7px rgba(217,119,6,.28)}
    100%{background:transparent;box-shadow:0 0 0 5px transparent,0 0 16px 7px transparent}
  }
  .uv-current{outline:2px solid #D97706;outline-offset:1px;border-radius:3px}

  /* ---- tijek provjere: stvarni koraci, bez umjetnog cekanja ---- */
  .progress{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
            padding:12px 16px;margin-bottom:18px}
  .progress.on{display:block}
  .progress .ph{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .progress ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .progress li{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .progress li .dot{font-family:var(--mono);font-size:11px;width:14px;text-align:center;color:var(--uv)}
  .progress li.done{color:var(--ink)}
  .progress li.now{color:var(--uv);font-weight:700}
  /* Gumb za prekid: pojavljuje se samo dok posao stvarno traje, da korisnik ne
     mora zatvarati stranicu ako je ubacio dokument od tristo stranica. */
  .progress .cancel{display:none;margin-top:10px;border-color:var(--danger);color:var(--danger)}
  .progress .cancel:hover{background:var(--danger-bg)}
  .progress.canstop .cancel{display:inline-block}

  /* ---- puls na crvenoj presudi ----
     Jedan ciklus 1,6 s (0,6 Hz), najvise tri ciklusa, pa mir. Nikad blizu
     granice od 3 bljeska u sekundi. Ugasen kad sustav trazi manje animacija. */
  .verdict.pulse{animation:uvPulse 1.6s ease-in-out 3}
  @keyframes uvPulse{
    0%,100%{background:var(--danger-bg);box-shadow:0 0 0 0 rgba(179,38,30,0)}
    50%{background:#F6D2CF;box-shadow:0 0 0 6px rgba(179,38,30,.16)}
  }
  @media(prefers-reduced-motion:reduce){
    .verdict.pulse{animation:none}
    .uv-jump{animation:none;background:#FDE68A}
  }

  /* ---- poruka kad Cmd+V ne donese ni datoteku ni tekst ---- */
  .note.paste{display:none;background:var(--warn-bg);color:var(--warn);border-top-color:#E8CDA3;font-weight:600}
  .note.paste.on{display:block}

  /* ---- nalazi: citat u UV boji, opis manjim sivim slovima ispod ---- */
  .finding.jump{cursor:pointer}
  .finding.jump:hover{background:#FAFCFE;border-color:var(--muted)}
  .finding.jump h3::after{content:"\2192";margin-left:6px;color:var(--uv);font-weight:400}
  .finding.hasnav h3::after{content:none}
  .fhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .fhead h3{flex:1 1 auto}

  /* ---- brojac pojava i strelice: kretanje kao kod trazenja rijeci ---- */
  .hits{display:flex;align-items:center;gap:3px;flex:none}
  .hitbtn{font-family:var(--mono);font-size:14px;line-height:1;border:1px solid var(--line);
          background:var(--panel);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer}
  .hitbtn:hover{border-color:var(--uv);color:var(--uv);background:var(--uv-bg)}
  .hitn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--uv);background:var(--uv-bg);
        border:1px solid #D9CBF3;border-radius:20px;padding:2px 9px;white-space:nowrap;cursor:default}
  .many{margin-top:7px;font-size:11.5px;color:var(--muted);background:var(--paper);
        border:1px dashed var(--line);border-radius:6px;padding:6px 9px}

  /* ---- kvacice: korisnik bira sto se brise iz kopije ----
     Prazne po zadanom. Alat ne brise ono sto je korisnik mogao vidjeti i sam;
     skriveni sadrzaj se brise uvijek i nema kvacicu. */
  .pickbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .item.pickable{display:flex;align-items:flex-start;gap:9px}
  .item.pickable .q{flex:1 1 auto;min-width:0}
  .pick{flex:none;display:flex;align-items:center;padding-top:1px;cursor:pointer}
  .pick input{width:15px;height:15px;cursor:pointer;accent-color:var(--uv);margin:0}
  .cutcount{font-family:var(--mono);font-size:11px;color:var(--uv);background:var(--uv-bg);
            border:1px solid #D9CBF3;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .finding.noloc{opacity:.85}
  .finding.noloc h3::after{content:attr(data-noloc);margin-left:8px;font-family:var(--mono);font-size:10px;
       font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
  .finding .detail{font-family:var(--mono);font-size:12px;margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-word;white-space:pre-wrap}
  .finding .items{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .finding .item{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  .finding .item .q{font-family:var(--mono);font-size:12px;color:var(--uv);word-break:break-word;white-space:pre-wrap;display:block}
  .finding .item .n{display:block;margin-top:3px;font-size:11px;color:var(--muted);font-family:var(--sans)}
  .finding .item.pickable .n{width:100%}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-row">
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1><span class="owlmark" id="owlMark"><img class="owl" src="assets/sovaweb_owl.png"
              alt="" aria-hidden="true"><span class="beam" aria-hidden="true"></span></span>OwlUV</h1>
        <h2 class="tagline" data-i18n="tagline"></h2>
        <p data-i18n="intro"></p>
      </div>
      <div class="langs">
        <button class="lang active" data-lang="hr">HR</button>
        <button class="lang" data-lang="en">EN</button>
        <button class="lang" data-lang="de">DE</button>
        <button class="lang" data-lang="fr">FR</button>
        <button class="lang" data-lang="es">ES</button>
        <button class="lang" data-lang="it">IT</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <div id="verdict" class="verdict"><div class="big" id="verdictBig"></div><div class="sub" id="verdictSub"></div></div>
  <div id="progress" class="progress"><div class="ph" id="progressH"></div><ol id="progressList"></ol>
    <button id="cancelBtn" class="btn ghost sm cancel" type="button"></button></div>
  <div class="grid">
    <section class="panel">
      <div class="panel-h">
        <span class="t ink" data-i18n="inputTitle"></span>
        <span class="fileinfo" id="fileInfo"></span>
        <span class="hbtns">
          <button class="btn ghost sm hastip" id="pickBtn" data-i18n="pickBtn" data-i18n-tip="pickTip"></button>
          <button class="btn ghost sm hastip" id="demoBtn" data-i18n="demoBtn" data-i18n-tip="demoTip"></button>
          <button class="btn ghost sm reset hastip tip-right" id="resetBtn" data-i18n="resetBtn" data-i18n-tip="resetTip"></button>
        </span>
      </div>
      <div class="dropzone" id="dropZone">
        <div id="input" contenteditable="true" spellcheck="false"></div>
        <div class="drop-overlay" id="dropOverlay"></div>
      </div>
      <input type="file" id="fileInput" style="display:none"
             accept=".txt,.md,.csv,.log,.json,.xml,.html,.htm,.docx,.doc,.pdf,text/plain,text/html,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <div class="stale" id="staleBar">
        <span class="msg" id="staleMsg"></span>
        <button class="btn rescan hastip" id="rescanBtn" data-i18n="rescanBtn" data-i18n-tip="rescanTip"></button>
      </div>
      <div class="note paste" id="pasteNote"></div>
      <div class="note recon" id="reconNote"></div>
      <div class="note" data-i18n="tip"></div>
    </section>
    <section class="panel">
      <div class="panel-h"><span class="t uv" data-i18n="vizTitle"></span><span class="count" id="charCount"></span></div>
      <div class="viz" id="viz"></div>
      <div class="note" data-i18n="legend"></div>
      <div class="copybar">
        <span class="btns">
          <button class="btn hastip" id="cleanBtn" data-i18n="cleanBtn" data-i18n-tip="cleanTip"></button>
          <button class="btn ghost hastip" id="saveBtn" data-i18n="saveBtn" data-i18n-tip="saveTip"></button>
        </span>
        <span class="cutcount" id="cutCount"></span>
        <span class="cnote" data-i18n="cleanNote"></span>
        <span class="cnote" data-i18n="saveNote"></span>
      </div>
    </section>
  </div>
  <section class="panel" style="margin-top:20px">
    <div class="panel-h"><span class="t" data-i18n="findingsTitle"></span><span class="count" id="findCount">-</span></div>
    <div class="findings" id="findings"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer><div class="wrap">
  <span data-i18n="footer"></span>
  <span class="by">
    <img src="assets/sovaweb_logo.svg" alt="SOVA WEB">
    <span data-i18n="footerBy"></span>
    <a href="https://sovaweb.net" rel="noopener">sovaweb.net</a>
  </span>
</div></footer>

<script src="js/i18n.js"></script>
<script src="js/detect.js"></script>

<script src="js/files.js"></script>
<script src="js/pdfread.js"></script>
<script src="js/signals.js"></script>
<script src="js/docxout.js"></script>
<script src="js/app.js"></script>
<script>
/* Rad bez interneta na telefonu. Radnik se prijavljuje samo kad je stranica
   posluzena s posluzitelja; otvorena iz mape (file://) preglednik ga ne
   dopusta, a alat i tako vec radi iz mape. Ako prijava ne uspije, nista se ne
   mijenja: alat radi dalje, samo bez ostave.

   Prijavljuje se samo GLAVNA stranica, nikad ugradena u tudi okvir: ugradena
   stranica nema pravo preuzeti ostavu za cijelo posluziteljsko ime. Zbog toga
   je automatski test, koji alat ucitava u okvir, potpuno isti u oba nacina. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0
   && window.top===window.self){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
